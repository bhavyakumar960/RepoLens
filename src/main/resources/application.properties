spring.application.name=spring-ai-mcp
spring.main.web-application-type=none

# ── Bitbucket Cloud (https://bitbucket.org/freechargebiz/axis-customerdigitalidentity) ──
bitbucket.base-url=https://api.bitbucket.org/2.0
bitbucket.username=${BITBUCKET_USERNAME}
bitbucket.app-password=${BITBUCKET_APP_PASSWORD}
bitbucket.workspace=freechargebiz

# ── Jira Cloud (https://freechargebiz.atlassian.net) ─────────────────────────
jira.base-url=https://freechargebiz.atlassian.net
jira.username=${JIRA_USERNAME}
jira.api-token=${JIRA_API_TOKEN}

# ── Confluence Cloud (https://freechargebiz.atlassian.net/wiki) ──────────────
confluence.base-url=https://freechargebiz-team-tp3t8aap.atlassian.net
confluence.username=${CONFLUENCE_USERNAME}
confluence.api-token=${CONFLUENCE_API_TOKEN}
confluence.default-space=MFS

# ── Vector Store Backend Selection ────────────────────────────────────────────
# Supported values: qdrant, weaviate
spring.profiles.active=${VECTOR_STORE_PROFILE:qdrant}

# ── Embedding Model: Ollama (local) ───────────────────────────────────────────
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.options.model=nomic-embed-text

# ── RAG Pipeline Configuration ────────────────────────────────────────────────
rag.top-k=5
rag.similarity-threshold=0.7
rag.chunk-size=1000
rag.min-chunk-size-chars=350
rag.documents-path=documents/
rag.embedding-model=${spring.ai.ollama.embedding.options.model:nomic-embed-text}
rag.auto-ingest-enabled=false
rag.reconciliation-enabled=false
rag.auto-ingest-java-root=/Users/vaibhav.rawat/Documents/workspace/axis_fd/axis-utilities

# Re-ranker Optimization Settings
rag.reranker-enabled=true
rag.reranker-base-url=http://localhost:8081
rag.reranker-min-documents=3
rag.reranker-skip-for-intents=EXACT_SYMBOL,CALL_GRAPH

# Adaptive retrieval: per-intent graph traversal depth (was hardcoded in AdaptiveRetrievalRouter)
rag.call-graph-depth=2
rag.dependency-graph-depth=3
rag.impact-analysis-depth=4
rag.business-logic-depth=2
rag.debugging-depth=3
rag.architecture-depth=2
rag.unknown-intent-depth=2

# Adaptive retrieval: per-intent vector-search query variation counts (was hardcoded)
rag.conceptual-query-count=2
rag.business-logic-query-count=3
rag.debugging-query-count=3
rag.architecture-query-count=3
rag.unknown-intent-query-count=2

# Retrieval provenance / debug mode (attach routing decisions to responses when requested)
rag.retrieval-debug-enabled=false

# ── Neo4j Graph Database ──────────────────────────────────────────────────────
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=password123
spring.data.neo4j.database=neo4j

# ── MySQL: Ingestion state (file/chunk hash tracking) ────────────────────────
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:spring_ai_mcp}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.org.example.springaimcp.service.JiraToolService=DEBUG
logging.level.org.example.springaimcp.service.BitbucketToolService=DEBUG
logging.level.org.example.springaimcp.service.ConfluenceToolService=DEBUG
logging.level.org.example.springaimcp.rag=DEBUG
logging.level.org.springframework.web.client.RestClient=DEBUG
logging.file.name=${log.path:logs}/spring-ai-mcp.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

# ── Code Intelligence Configuration ───────────────────────────────────────────
codeintel.retrieval.top-k=8
codeintel.retrieval.max-depth=5
codeintel.retrieval.max-results=100
codeintel.retrieval.max-lines=500
codeintel.retrieval.timeout-ms=30000
codeintel.retrieval.enable-caching=true
codeintel.retrieval.cache-ttl-seconds=300