version: "3.9"

services:

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.25.0
    container_name: weaviate
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1
    volumes:
      - weaviate_data:/var/lib/weaviate
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-latest
    container_name: tei_reranker
    ports:
      - "8081:80"
    environment:
      - HUGGINGFACE_HUB_CACHE=/data
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-bundle.pem
      - SSL_CERT_FILE=/etc/ssl/certs/ca-bundle.pem
    volumes:
      - tei_storage:/data
      - ./finalCato.pem:/etc/ssl/certs/ca-bundle.pem:ro
    command: --model-id BAAI/bge-reranker-base
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - local-net

  neo4j:
    image: neo4j:2026.05-community
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser / HTTP
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/password123
      # APOC
      NEO4J_PLUGINS: '["apoc"]'
      # Memory - suitable for local POC
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
      # Allow APOC procedures
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - local-net

volumes:
  weaviate_data:
  ollama_data:
  tei_storage:
  qdrant_data:
  neo4j_data:
  neo4j_logs:

networks:
  local-net:
    driver: bridge